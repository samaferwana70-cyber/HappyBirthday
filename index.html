<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🎂</title>

  <style>
    :root {
      --bg1: #ffe3ec;
      --bg2: #fff4e6;
      --ink: #a8325e;
      --hint: #8a5a6b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg1: #3a1830;
        --bg2: #1d1230;
        --ink: #ffd0e2;
        --hint: #d9aabd
      }
    }

    :root[data-theme="dark"] {
      --bg1: #3a1830;
      --bg2: #1d1230;
      --ink: #ffd0e2;
      --hint: #d9aabd
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden
    }

    body {
      background: radial-gradient(ellipse at 50% 40%, #2a1238, #0b0614 75%);
      font-family: 'Tajawal', Tahoma, Arial, sans-serif
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none
    }

    .t {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      pointer-events: none
    }

    .t h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 52px);
      color: var(--ink);
      font-weight: 800;
      text-shadow: 0 2px 12px rgba(255, 255, 255, .35)
    }

    .t p {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--hint)
    }

    #fc,
    #oc {
      position: fixed;
      inset: 0;
      pointer-events: none
    }

    #fc {
      z-index: 0
    }

    #c {
      z-index: 1;
      opacity: 0;
      transform: scale(.6);
      transition: opacity 2.4s ease, transform 2.8s cubic-bezier(.2, 1.25, .4, 1)
    }

    #oc {
      z-index: 2
    }

    .on #c {
      opacity: 1;
      transform: none
    }

    .t {
      z-index: 3;
      opacity: 0;
      transition: opacity 2s ease 1.2s
    }

    .on .t {
      opacity: 1
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      transition: opacity 1.8s ease
    }

    #intro.go {
      opacity: 0;
      pointer-events: none
    }

    #ic {
      position: absolute;
      inset: 0
    }

    #ih {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(env(safe-area-inset-top, 0px) + 7vh);
      text-align: center;
      color: #ffe3c2;
      transition: opacity .5s;
      pointer-events: none
    }

    #ih b {
      display: block;
      font-size: clamp(26px, 6vw, 44px);
      font-weight: 800;
      text-shadow: 0 0 18px rgba(255, 170, 80, .7)
    }

    #ih span {
      display: block;
      margin-top: 8px;
      font-size: clamp(15px, 3.6vw, 20px);
      opacity: .85;
      animation: pu 1.8s ease-in-out infinite
    }

    @keyframes pu {
      50% {
        opacity: .35
      }
    }

    body.gifts {
      background: radial-gradient(ellipse at 50% 40%, #3b1a63, #10082a 75%) !important
    }

    #gb {
      position: fixed;
      left: 50%;
      bottom: calc(26px + env(safe-area-inset-bottom, 0px));
      width: 84px;
      height: 84px;
      margin-left: -42px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff7ab3, #ff3d81);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      z-index: 5;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s 5s;
      animation: gp 1.4s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .on #gb {
      opacity: 1;
      pointer-events: auto
    }

    body.gifts #gb {
      display: none
    }

    @keyframes gp {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 106, 168, .7), 0 8px 24px rgba(0, 0, 0, .4)
      }

      50% {
        transform: scale(1.13);
        box-shadow: 0 0 0 24px rgba(255, 106, 168, 0), 0 8px 24px rgba(0, 0, 0, .4)
      }
    }

    #gb.boom {
      animation: bm .6s ease-in forwards
    }

    @keyframes bm {
      to {
        transform: scale(8);
        opacity: 0
      }
    }

    #fl {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: radial-gradient(circle, #fff, #ffd6ec 45%, rgba(255, 214, 236, 0) 75%);
      opacity: 0;
      pointer-events: none
    }

    #fl.go2 {
      animation: fl 1.1s ease-out
    }

    @keyframes fl {
      0% {
        opacity: 0
      }

      35% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    #ks {
      position: fixed;
      width: min(60vw, 300px);
      left: 50%;
      top: 42%;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      filter: drop-shadow(0 0 16px rgba(255, 80, 130, .75))
    }

    #ks.on2 {
      animation: ks 4.2s forwards
    }

    @keyframes ks {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-14deg) scale(3)
      }

      7% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-14deg) scale(.9)
      }

      12% {
        transform: translate(-50%, -50%) rotate(-14deg) scale(1.06)
      }

      18% {
        transform: translate(-50%, -50%) rotate(-14deg) scale(1)
      }

      78% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-14deg) scale(1)
      }
    }

    #ks,
    #kp {
      position: fixed;
      width: min(58vw, 290px);
      left: 50%;
      top: 42%;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      transform: translate(-50%, -50%) rotate(0deg)
    }

    #kp {
      z-index: 7;
      filter: drop-shadow(0 0 3px rgba(200, 20, 70, .5))
    }

    #ks {
      filter: drop-shadow(0 0 14px rgba(255, 80, 130, .6))
    }

    #kg {
      position: fixed;
      width: min(58vw, 290px);
      aspect-ratio: 1;
      border-radius: 50%;
      left: 50%;
      top: 42%;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      background: radial-gradient(circle, rgba(255, 170, 205, .75), rgba(255, 170, 205, 0) 68%);
      transform: translate(-50%, -50%) scale(.4)
    }

    #ks.on2 {
      animation: kf 7s forwards
    }

    #kp.on2 {
      animation: kq 7s forwards
    }

    #kg.on2 {
      animation: kh 7s forwards
    }

    @keyframes kf {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-12deg) scale(.04);
        filter: blur(6px)
      }

      8% {
        opacity: 1
      }

      17% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-12deg) scale(1.08);
        filter: blur(0)
      }

      21% {
        transform: translate(-50%, -50%) rotate(-12deg) scale(.94, .88)
      }

      36% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-12deg) scale(.96, .9)
      }

      46% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-12deg) scale(1.9);
        filter: blur(12px)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-12deg) scale(1.9)
      }
    }

    @keyframes kq {

      0%,
      16% {
        opacity: 0
      }

      19% {
        opacity: .92
      }

      45% {
        opacity: .88
      }

      100% {
        opacity: 0
      }
    }

    @keyframes kh {

      0%,
      16% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4)
      }

      20% {
        opacity: .85
      }

      42% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.9)
      }

      100% {
        opacity: 0
      }
    }

    #kp.on2 {
      animation: kq 4.6s forwards
    }

    #kg.on2 {
      animation: kh 1.2s forwards
    }

    @keyframes kq {
      0% {
        opacity: 0
      }

      4% {
        opacity: .92
      }

      35% {
        opacity: .88
      }

      100% {
        opacity: 0
      }
    }

    @keyframes kh {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.5)
      }

      25% {
        opacity: .8
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.8)
      }
    }

    #kp.on2 {
      animation: kq 7s forwards
    }

    @keyframes kq {
      0% {
        opacity: 0
      }

      3% {
        opacity: .92
      }

      40% {
        opacity: .9
      }

      100% {
        opacity: 0
      }
    }
  </style>
</head>
